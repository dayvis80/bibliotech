name: Publicar imagenes BiblioTech
 
on:
  push:
    tags:
      - 'v*.*.*'
 
permissions:
  contents: read
  packages: write
 
jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nombre: backend
            carpeta: backend
          - nombre: frontend
            carpeta: frontend
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
 
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Generar etiqueta de imagen
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/$OWNER/bibliotech-${{ matrix.nombre }}"
          echo "image=$IMG:$VERSION" >> "$GITHUB_OUTPUT"
 
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.carpeta }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
