name: BiblioTech CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Maven y JUnit
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas del backend
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend - ESLint y Build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: frontend
        run: npx ng lint

      - name: Compilar Angular
        working-directory: frontend
        run: npx ng build